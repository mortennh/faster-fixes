# Self-hosted FasterFixes on the monh VPS (/opt/faster-fixes, branch self-host).
#   https://feedback.monh.dev        → app       (127.0.0.1:3400)
#   https://feedback-files.monh.dev  → SeaweedFS S3 (127.0.0.1:8433)
#   Inngest dashboard                → 127.0.0.1:8288 (SSH tunnel only)
# Secrets: self-host/.env (template .env.example). Deployed by .github/workflows/self-host.yml.

name: faster-fixes

services:
  db:
    image: postgres:16-alpine
    container_name: ff-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: fasterfixes
      POSTGRES_USER: fasterfixes
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fasterfixes -d fasterfixes"]
      interval: 10s
      timeout: 5s
      retries: 5

  # S3-compatible object storage for screenshots (MinIO no longer ships images)
  storage:
    image: chrislusf/seaweedfs:latest
    container_name: ff-storage
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=512 -volume.max=0 -ip.bind=0.0.0.0
    ports:
      - "127.0.0.1:8433:8333"
    volumes:
      - storage_data:/data
      - ./s3.json:/etc/seaweedfs/s3.json:ro

  inngest:
    image: inngest/inngest:v1.45.1
    container_name: ff-inngest
    restart: unless-stopped
    command: inngest start --event-key ${INNGEST_EVENT_KEY:?} --signing-key ${INNGEST_SIGNING_KEY:?} --sdk-url http://app:3000/api/inngest
    ports:
      - "127.0.0.1:8288:8288"
    volumes:
      - inngest_data:/root/.inngest

  app:
    image: ghcr.io/mortennh/faster-fixes:self-host
    container_name: ff-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3400:3000"
    environment:
      DOMAIN_NAME: feedback.monh.dev
      BASE_URL: https://feedback.monh.dev
      BETTER_AUTH_URL: https://feedback.monh.dev
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
      DATABASE_URL: postgresql://fasterfixes:${DB_PASSWORD}@db:5432/fasterfixes?schema=public
      DATABASE_DRIVER: pg
      STORAGE_REGION: us-east-1
      STORAGE_BUCKET_NAME: feedback
      MINIO_ENDPOINT: https://feedback-files.monh.dev
      MINIO_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?}
      MINIO_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?}
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY}
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY}
      INNGEST_BASE_URL: http://inngest:8288
      INNGEST_DEV: "0"
      DISABLE_SIGN_UP: ${DISABLE_SIGN_UP:-false}
      NEXT_PUBLIC_IS_CLOUD: "false"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  storage_data:
  inngest_data:
