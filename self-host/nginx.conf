# /etc/nginx/conf.d/faster-fixes.conf on the monh VPS
# Certificate: sudo certbot certonly --webroot -w /var/www/html -d feedback.monh.dev -d feedback-files.monh.dev --cert-name feedback.monh.dev

server {
    listen 80;
    server_name feedback.monh.dev feedback-files.monh.dev;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name feedback.monh.dev;
    ssl_certificate /etc/letsencrypt/live/feedback.monh.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/feedback.monh.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 25m; # screenshots

    location / {
        proxy_pass http://127.0.0.1:3400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# S3 endpoint — presigned URLs are signed for this host, so keep Host intact.
server {
    listen 443 ssl;
    http2 on;
    server_name feedback-files.monh.dev;
    ssl_certificate /etc/letsencrypt/live/feedback.monh.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/feedback.monh.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8433;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }
}
